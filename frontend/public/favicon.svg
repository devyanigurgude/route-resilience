<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Subtle Grid Lines -->
  <line x1="2" y1="22" x2="62" y2="22" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  <line x1="2" y1="42" x2="62" y2="42" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  <line x1="22" y1="2" x2="22" y2="62" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  <line x1="42" y1="2" x2="42" y2="62" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Road Network Edges -->
  <path d="M14 50 L26 36 L38 38 L50 16" stroke="url(#roadGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M26 36 L24 18" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" />
  <path d="M38 38 L48 46" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" />

  <!-- Inferred Resilient Bridge Segment (dashed) -->
  <path d="M24 18 L40 18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5 2" />

  <!-- Network Junction Nodes -->
  <circle cx="14" cy="50" r="3.5" fill="#14B8A6" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="26" cy="36" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="38" cy="38" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="50" cy="16" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="24" cy="18" r="3" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.2" />
  <circle cx="48" cy="46" r="3" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.2" />
</svg>
